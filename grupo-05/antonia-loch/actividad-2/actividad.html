    <section id="descripcion">
      <h2>Descripción</h2>
      <p>
        La Wassily es una silla de club reducida a lo esencial: una estructura
        de tubos de acero doblados y franjas de cuero o tela que forman el
        asiento, el respaldo y los apoyabrazos.
      </p>
      <p class="destacado">
        Fue una de las primeras sillas del mundo hechas con tubo de acero curvado.
      </p>
    </section>

    <section id="materiales">
      <h2>Materiales</h2>
      <ul>
        <li>Estructura de tubo de acero cromado.</li>
        <li>Asiento, respaldo y apoyabrazos de cuero o tela.</li>
      </ul>
    </section>

    <section id="contexto">
      <h2>Contexto</h2>
      <p>
        Breuer la diseñó en la Bauhaus, la escuela de diseño alemana, y se dice
        que se inspiró en el manubrio de una bicicleta. Su nombre viene de
        Wassily Kandinsky, colega de Breuer en la escuela, que tenía una en su casa.
      </p>
