<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | pumpkinguurl</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body class="pag-galeria">
    <header class="navbar">
        <a class="logo" href="index.html">pumpkinguurl</a>
        <nav aria-label="Navegación principal">
            <ul class="nav-links">
                <li><a href="index.html#fotos">Fotos</a></li>
                <li><a href="index.html#sobre-mi">Sobre mí</a></li>
                <li><a href="portafolio.html">Portafolio</a></li>
            </ul>
        </nav>
    </header>

    <!-- LIENZO: la ventana por donde se ven las fotos. El JS llena el "mundo" con las fotos -->
    <main class="lienzo cargando-fotos" tabindex="0" aria-label="Galería de fotos. Arrastra o usa las flechas del teclado para recorrerla">
        <p class="cargando">0%</p>
        <div class="mundo"></div>
    </main>

    <!-- BARRA DE ABAJO -->
    <div class="pie-galeria">
        <p>Arrastra para explorar</p>
        <p class="contador">— fotos</p>
    </div>

    <!-- VISOR: se abre al hacer clic en una foto -->
    <dialog class="visor">
        <button class="visor-cerrar" type="button">Cerrar</button>
        <img class="visor-foto" src="" alt="">
    </dialog>
</body>
</html>
