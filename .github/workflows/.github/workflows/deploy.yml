name: Publicar portafolio

on:
  push:
    branches:
      - main
    paths:
      - 'grupo-09/sofia-guzman/Examen/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar portafolio
        run: |
          mkdir public
          cp -R grupo-09/sofia-guzman/Examen/. public/

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
